networks:
  vacancy_hunter:
    external: true
    name: vacancy_hunter
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-vacancyhunter
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vacancy_hunter
    env_file:
      - .env

volumes:
  postgres_data:
