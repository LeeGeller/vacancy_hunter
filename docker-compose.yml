services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-vacancyhunter
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vacancyhunter
    env_file:
      - .env

networks:
  vacancyhunter:
    driver: bridge

volumes:
  postgres_data:
